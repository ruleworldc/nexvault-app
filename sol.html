<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NexVault · Solana</title>
    <link rel="icon" type="image/png" href="/nexvault-app/icon.png" />
    <!-- TweetNaCl for x25519 Diffie-Hellman + secretbox (Phantom deep-link encryption) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tweetnacl/1.0.3/nacl.min.js"></script>
    <style>
      :root { --bg:#080810; --card:#14141f; --text:#e8e8f4; --muted:#9a9ab0; --purple:#8b7bfd; --line:rgba(255,255,255,.08); }
      * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
      html,body { margin:0; padding:0; background:var(--bg); color:var(--text); min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
      .wrap { max-width:460px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; }
      .logo { font-size:22px; font-weight:800; letter-spacing:.5px; margin-bottom:6px; }
      .logo span { background:linear-gradient(90deg,#8b7bfd,#3aa0ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
      .sub { color:var(--muted); font-size:13px; margin-bottom:26px; }
      .card { width:100%; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:24px 20px; }
      .spinner { width:40px; height:40px; margin:0 auto 18px; border:3px solid rgba(255,255,255,.15); border-top-color:var(--purple); border-radius:50%; animation:spin .8s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      .status { font-size:15px; font-weight:600; margin-bottom:8px; }
      .detail { color:var(--muted); font-size:12.5px; line-height:1.5; word-break:break-all; }
      .addr { margin-top:14px; font-family:monospace; font-size:12px; background:rgba(0,0,0,.35); border:1px solid var(--line); border-radius:10px; padding:10px 12px; word-break:break-all; }
      .ok { color:#7ee0a1; } .err { color:#ff7a7a; }
      .quote { margin-top:16px; text-align:left; border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:rgba(0,0,0,.25); }
      .quote-row { display:flex; justify-content:space-between; font-size:13px; padding:4px 0; }
      .quote-row .k { color:var(--muted); } .quote-row .v { font-weight:600; }
      .quote-recv { color:#8b7bfd; font-weight:700; }
      .note { color:var(--muted); font-size:11px; margin-top:10px; line-height:1.5; }
      .btn { display:block; width:100%; margin-top:16px; padding:14px; border:none; border-radius:14px; font-size:15px; font-weight:700; cursor:pointer; color:#fff; background:linear-gradient(90deg,#7b5bfd,#3aa0ff); text-align:center; text-decoration:none; }
      .btn.secondary { background:rgba(255,255,255,.06); border:1px solid var(--line); }
      .btn[disabled] { opacity:.5; pointer-events:none; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">Nex<span>Vault</span></div>
      <div class="sub">Solana</div>
      <div class="card" id="card">
        <div class="spinner" id="spinner"></div>
        <div class="status" id="status">Loading…</div>
        <div class="detail" id="detail"></div>
      </div>
    </div>

    <script>
    (function () {
      "use strict";

      // ── base58 (Bitcoin alphabet) — unit-tested vs standard vectors ────────────
      var B58 = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
      function b58encode(bytes) {
        var zeros = 0; while (zeros < bytes.length && bytes[zeros] === 0) zeros++;
        var digits = [];
        for (var i = zeros; i < bytes.length; i++) {
          var carry = bytes[i];
          for (var j = 0; j < digits.length; j++) { carry += digits[j] << 8; digits[j] = carry % 58; carry = (carry / 58) | 0; }
          while (carry > 0) { digits.push(carry % 58); carry = (carry / 58) | 0; }
        }
        var str = ""; for (var z = 0; z < zeros; z++) str += "1";
        for (var q = digits.length - 1; q >= 0; q--) str += B58[digits[q]];
        return str;
      }
      function b58decode(str) {
        var zeros = 0; while (zeros < str.length && str[zeros] === "1") zeros++;
        var bytes = [];
        for (var i = zeros; i < str.length; i++) {
          var c = B58.indexOf(str[i]); if (c < 0) throw new Error("Invalid base58 character");
          var carry = c;
          for (var j = 0; j < bytes.length; j++) { carry += bytes[j] * 58; bytes[j] = carry & 0xff; carry >>= 8; }
          while (carry > 0) { bytes.push(carry & 0xff); carry >>= 8; }
        }
        var out = []; for (var z = 0; z < zeros; z++) out.push(0);
        for (var q = bytes.length - 1; q >= 0; q--) out.push(bytes[q]);
        return new Uint8Array(out);
      }
      function b64ToBytes(b64) { var bin = atob(b64); var a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
      function bytesToB64(bytes) { var s = ""; for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s); }

      // ── shared-secret encrypt/decrypt (nacl.box after Diffie-Hellman) ──────────
      function encryptPayload(obj, sharedB58) {
        var shared = b58decode(sharedB58);
        var nonce = nacl.randomBytes(24);
        var box = nacl.box.after(new TextEncoder().encode(JSON.stringify(obj)), nonce, shared);
        return { nonce: b58encode(nonce), payload: b58encode(box) };
      }
      function decryptData(dataB58, nonceB58, sharedB58) {
        var opened = nacl.box.open.after(b58decode(dataB58), b58decode(nonceB58), b58decode(sharedB58));
        if (!opened) throw new Error("Could not decrypt wallet response.");
        return JSON.parse(new TextDecoder().decode(opened));
      }

      /* ╔═══════════════════════════════════════════════════════════════════════════╗
         ║ ✅ CONFIRMED WORKING 2026-07-18 — Phantom AND Solflare, verified by owner. ║
         ║ ⛔ LOCKED FILE. DO NOT MODIFY WHILE WORKING ON OTHER FEATURES.             ║
         ║                                                                           ║
         ║ Change this file ONLY when genuinely required: the wallet's own deep-link  ║
         ║ protocol changes, something breaks at core level, or a new feature is      ║
         ║ deliberately added here. Never edit it as a side effect of another task.   ║
         ║ Any change requires re-testing BOTH wallets end-to-end: connect → quote →  ║
         ║ sign → broadcast → on-chain.                                               ║
         ║                                                                           ║
         ║ THE RULES THAT MAKE THIS WORK (each cost real debugging — do not relearn): ║
         ║ 1. RESPONSE KEY NAME is per-wallet: phantom_encryption_public_key vs       ║
         ║    solflare_encryption_public_key. We match ANY *_encryption_public_key.   ║
         ║    Hardcoding Phantom's name broke Solflare completely (Fix #78).          ║
         ║ 2. ANDROID uses intent:// with SINGLE-encoded values (b147). iOS uses the  ║
         ║    universal link. ⚠️ This was DOUBLE-encoded until b147 on the theory that ║
         ║    Telegram's browser decodes once extra; the b146 on-screen diagnostic    ║
         ║    DISPROVED that — Phantom got app_url/redirect_link still %-encoded after ║
         ║    its own decode → no prompt. Do not flip this back without re-running    ║
         ║    that diagnostic. Same builder powers connect AND disconnect (Fix #62)   ║
         ║ 3. dk (ephemeral secret) MUST ride in redirect_link. Wallets return into   ║
         ║    the DEFAULT browser, not the one that started the flow, so localStorage ║
         ║    alone is not enough.                                                    ║
         ║ 4. NATIVE SOL = 11111111111111111111111111111111 (System Program), NOT the ║
         ║    wrapped mint So111…112. Wrapped → InvalidAccountData, swap fails sim.   ║
         ║ 5. signTransaction ONLY. signAndSendTransaction is DEPRECATED and returns  ║
         ║    "not supported". We sign, then broadcast ourselves.                     ║
         ║ 6. Broadcast needs a keyed RPC (Helius). Public api.mainnet-beta 403s      ║
         ║    browser sends. Keep the initial delay + retry cycle: the network is not ║
         ║    ready the instant the wallet hands back.                                ║
         ║ 7. backToTelegram REPLACES this tab with tg:// (b192). NEVER window.open, ║
         ║    and NEVER a ?startapp link — that param LAUNCHES the Mini App, so it ║
         ║    opened a second instance beside the one still running.               ║
         ║    the t.me link, which re-opened the Mini App while the original was   ║
         ║    still running — two live instances. Never window.open a new tab.     ║
         ║    one — a lingering page stops Telegram opening the next swap (Fix #65).  ║
         ║ 8. Connect/sign must be a real USER TAP (anchor), never a programmatic     ║
         ║    redirect.                                                               ║
         ╚═══════════════════════════════════════════════════════════════════════════╝ */

      // ── constants ─────────────────────────────────────────────────────────────
      // ⇩⇩ WHEN MOVING TO nexvaultapp.com: change ONLY this BASE line. Everything
      //    (app_url, redirect_link, this page) derives from it.
      var BASE      = "https://nexvaultapp.com";
      var APP_URL   = BASE + "/";
      var THIS_PAGE = BASE + "/sol.html";
      // ⚠️ NO ?startapp HERE — THAT PARAM WAS THE BUG.
      // "?startapp=" is Telegram's Mini App LAUNCH parameter, so returning through it
      // started a SECOND instance while the first was still running (owner-reported).
      // tg:// simply brings Telegram to the foreground, where the original instance
      // is still open — which is all "back to Telegram" ever needed to do.
      // ── RETURNING TO THE TELEGRAM APP ────────────────────────────────────────
      // 🔴 2026-08-05, second round: the anchor <a href="tg://…"> was correct in principle
      // but did NOTHING on Android — the browser silently ignored it, our 2.5s fallback link
      // appeared, and tapping that opened the t.me WEB page, which then tried to launch the
      // app itself and got "blocked from automatically opening an external application".
      // Dead end at every step.
      // This is ALREADY A SOLVED PROBLEM IN THIS CODEBASE: "Android browsers SILENTLY IGNORE
      // a plain custom scheme" is the b128 finding for okx://, and b131 fixed it with
      // intent://. sol.html's wallet links and evmbrowse.html both use that form. The return
      // path just never got it.
      // ⛔ NO `package=` HERE. Telegram ships as org.telegram.messenger (Play),
      // org.telegram.messenger.web (direct APK) and Telegram X — naming the wrong one sends a
      // user WITH TELEGRAM INSTALLED to the Play Store, which is the b129 trap. `scheme=tg`
      // resolves against whichever app registers it, and S.browser_fallback_url guarantees we
      // land on t.me rather than an error if none does.
      // ⚠️ intent:// is safe HERE because this is a normal browser page. It CRASHES the
      // Telegram Mini App WebView (Fix #73) — never move this into the TMA.
      var IS_ANDROID = /android/i.test(navigator.userAgent);
      var TG_WEB = "https://t.me/TheNexVaultBot";   // no launch param: cannot spawn an instance
      var TG = IS_ANDROID
        ? "intent://resolve?domain=TheNexVaultBot#Intent;scheme=tg;S.browser_fallback_url="
          + encodeURIComponent(TG_WEB) + ";end"
        : "tg://resolve?domain=TheNexVaultBot";
      // ⛔ THERE IS NO `TG_AUTO`, AND THERE MUST NOT BE ONE. b270 added a scripted navigation
      // to a fallback-less intent for the auto-return; on the owner's device it RELOADED THIS
      // PAGE instead of switching apps, the reload re-entered the sign flow, and a COMPLETED
      // swap was repainted as "Quote expired" with a Try again button. Removed the same day.
      // ⛔ NO AUTOMATIC OR TIMED NAVIGATION FROM THIS PAGE, in any form. Only `window.close()`
      // (which cannot navigate) and a REAL TAP on the anchor below.
      // Primary: Helius (domain-restricted to our origin, so the key is harmless if
      // seen). Fallbacks: keyless public RPCs. Public api.mainnet-beta is omitted —
      // it 403s browser sendTransaction.
      var RPCS = [
        "https://mainnet.helius-rpc.com/?api-key=b8f1254b-d873-4552-b083-dc5d5e2128ba",
        "https://solana-rpc.publicnode.com",
        "https://endpoints.omniatech.io/v1/sol/mainnet/public"
      ];
      // ── Supabase swap logging (Phantom/Solflare) ───────────────────────────────
      // Same swap_logs table as the in-app path. Insert-only anon key (RLS enforced).
      // Captures wallet_name (Phantom/Solflare) + coarse country/region so these deep-link
      // swaps show up in analytics alongside EVM/TON. Best-effort — NEVER blocks the swap.
      // Requires the wallet_name/country/region columns on swap_logs (added for b157).
      var SUPABASE_URL = "https://dxtnqmhuxyftrbkbkgxr.supabase.co";
      var SUPABASE_ANON_KEY = "sb_publishable_bhDEkqUa7Oh6CNx2pnf1_A_D6z4Hj59";
      var CHAIN_NAME = { "1151111081099710":"Solana","1":"Ethereum","56":"BNB Chain","137":"Polygon",
        "42161":"Arbitrum","10":"Optimism","8453":"Base","43114":"Avalanche","5000":"Mantle",
        "143":"Monad","59144":"Linea","534352":"Scroll","324":"zkSync","1329":"Sei","146":"Sonic",
        // ⚠️ NOT COSMETIC. swapToAddress() derives `evmDest` from `!!CHAIN_NAME[toChain]`, so a
        // chain missing here ALSO skips the 0x-shape recipient check — a SOL→Plasma swap would
        // be quoted with an unvalidated payout address. Every new EVM chain belongs in this map.
        "9745":"Plasma",
        // Bitcoin and Tron were missing, so a SOL→BTC swap logged a raw chain id into swap_logs.
        "20000000000001":"Bitcoin","728126428":"Tron" };
      function chainName(id) { return CHAIN_NAME[String(id)] || String(id || ""); }

      // ⛔ THE RECIPIENT MUST BELONG TO THE DESTINATION CHAIN — never fall back across
      // ecosystems. This mirrors destAddress() in evm.html, added after the same shape of
      // bug there sent a user's EVM address as a Solana payout address (2026-08-04).
      //
      // The old expression was `toAddress: sp.toAddress || sess.address`. For a NON-Solana
      // destination with a blank recipient that quietly substitutes the SOLANA address, so
      // Li.Fi would be asked to deliver ETH/USDC/BTC to a base58 Solana key. SwapPage does
      // refuse to open this page without a validated recipient, so the app never reached
      // it — but this page is reachable directly by URL, and the failure is unrecoverable.
      //
      // SOL→SOL keeps the blank fallback DELIBERATELY: the output goes to the connected
      // wallet, which is the documented allowBlank case in SwapPage.
      var SOL_CHAIN = "1151111081099710";
      function swapToAddress(sess, sp) {
        var isSolDest = String(sp.toChain) === SOL_CHAIN;
        if (isSolDest) return sp.toAddress || sess.address;
        if (!sp.toAddress) {
          throw new Error("This swap pays out on " + chainName(sp.toChain) + " and needs a "
            + chainName(sp.toChain) + " receive address. Go back to NexVault and enter one.");
        }
        // One wrong-ecosystem case is unmistakable and worth catching here: a Solana
        // address on an EVM destination. Every EVM chain uses 0x + 40 hex, so requiring
        // that shape has no false positives. BTC and TRX are checksum-validated in
        // SwapPage (base58check / bech32) and passed through untouched.
        var evmDest = !!CHAIN_NAME[String(sp.toChain)] && String(sp.toChain) !== "20000000000001"
                      && String(sp.toChain) !== "728126428";
        if (evmDest && !/^0x[0-9a-fA-F]{40}$/.test(sp.toAddress)) {
          throw new Error("The receive address is not an " + chainName(sp.toChain)
            + " address. This swap pays out on " + chainName(sp.toChain) + " and needs a 0x address.");
        }
        return sp.toAddress;
      }
      // Coarse geo only (country + region, no city/coords). One lookup, cached, silent-fail.
      var _geo = {};
      try {
        fetch("https://ipapi.co/json/").then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) { if (d && !d.error) _geo = { country: d.country_name || d.country, region: d.region }; })
          .catch(function () {});
      } catch (e) {}
      function logSwap(f) {
        try {
          fetch(SUPABASE_URL + "/rest/v1/swap_logs", {
            method: "POST",
            headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY,
              "Content-Type": "application/json", "Prefer": "return=minimal" },
            body: JSON.stringify({
              // ⚠️ ONE CONVENTION: tab is the SOURCE CHAIN FAMILY — TON | EVM | SOL.
              // Was "defi", a legacy value that said nothing and made the admin NETWORK
              // column show four labels for one concept. See "⛔ SWAP LOGGING" in CLAUDE.md.
              status: f.status || "success", tab: "SOL", failed_reason: f.failed_reason || undefined,
              from_chain: f.from_chain, to_chain: f.to_chain,
              from_token: f.from_token, to_token: f.to_token,
              from_amount: f.from_amount, to_amount: f.to_amount,
              from_wallet: f.from_wallet, to_wallet: f.to_wallet,
              aggregator: f.aggregator,
              aggregator_fee_usd: f.aggregator_fee_usd || "", nexvault_fee_usd: f.nexvault_fee_usd || "",
              tx_hash: f.tx_hash, wallet_name: f.wallet_name,
              country: _geo.country, region: _geo.region
            }),
            keepalive: true
          }).catch(function () {});
        } catch (e) {}
      }

      // ⚠️ FAILURES WERE INVISIBLE. SwapPage logs status 'failed' on the in-app path, but
      // neither standalone page did — a swap that got no route, or that the user rejected,
      // or that the bridge failed, left NO trace at all. "No row" then reads as "nothing
      // happened" rather than "something went wrong", which is the same blind spot that
      // hid the missing-logging bug itself.
      var _loggedFail = false;
      function logFail(reason, sp, sig) {
        if (_loggedFail) return;
        _loggedFail = true;
        try {
          logSwap({
            status: "failed",
            failed_reason: String(reason || "").slice(0, 300),
            from_chain: sp ? chainName(sp.fromChain) : "", to_chain: sp ? chainName(sp.toChain) : "",
            from_token: sp ? sp.fromSym : "", to_token: sp ? sp.toSym : "",
            from_amount: "", to_amount: "", from_wallet: "", to_wallet: (sp && sp.toAddress) || "",
            aggregator: "", tx_hash: sig || "", wallet_name: WNAME
          });
        } catch (e) {}
      }

      // ── FOLLOW THE SWAP TO THE END ────────────────────────────────────────────────
      // ⚠️ THIS PAGE USED TO STOP AT "Swap submitted". A SOL→TRX swap that delivered
      // perfectly still read "Your transaction is confirming on Solana" forever, so the
      // user had to go and check an explorer to find out whether their money arrived —
      // and for a CROSS-CHAIN swap that sentence is wrong anyway, because the money
      // lands on the DESTINATION chain, not Solana. Same rule and same shape as
      // evm.html's trackSwap(): submitted is not an outcome.
      //
      // TWO trackers, because one does not cover both cases:
      //  • SAME-CHAIN (incl. the Jupiter fallback, which Li.Fi has never heard of) — the
      //    Solana signature IS the entire swap, so ask the chain: getSignatureStatuses.
      //  • CROSS-CHAIN — the signature is only the SOURCE leg. Li.Fi /v1/status follows
      //    it through to delivery.
      // 🔴 2026-08-09 — "Li.Fi returns 200 + NOT_FOUND and NEVER 404s" WAS WRITTEN HERE AND
      // IT IS NO LONGER TRUE. Re-probed today: an unindexed txHash answers HTTP 404, and an
      // invalid `bridge` value answers 400. Both used to fall into "warn and keep polling",
      // so the NOT_FOUND cap below was dead code. Same defect as evm.html, same fix: count
      // 404 as not-found. ⛔ A DOCUMENTED API SHAPE IS AN OBSERVATION WITH A DATE ON IT, not
      // a constant — this one changed under us and cost a full round of debugging.
      // Everything here is display-only and best-effort: it can never affect the swap,
      // which has already been broadcast by the time this runs.

      // ⛔ EVERY NETWORK CALL INSIDE A POLL LOOP NEEDS ITS OWN TIMEOUT. A fetch in flight
      // when a mobile WebView freezes can settle NEVER — no resolve, no reject — and the
      // chain of .then(poll) simply stops, leaving the card on its last message for ever.
      // abort() only ASKS; the race is what guarantees we move on.
      function fetchT(url, opts, ms) {
        ms = ms || 15000;
        var ctl = (typeof AbortController === "function") ? new AbortController() : null;
        var timer;
        var o = {};
        for (var k in (opts || {})) o[k] = opts[k];
        if (ctl) o.signal = ctl.signal;
        var bell = new Promise(function (_res, rej) {
          timer = setTimeout(function () {
            try { if (ctl) ctl.abort(); } catch (e) {}
            rej(new Error("status-timeout"));
          }, ms);
        });
        return Promise.race([fetch(url, o), bell])
          .then(function (r) { clearTimeout(timer); return r; },
                function (e) { clearTimeout(timer); throw e; });
      }
      // Visible-time accounting — boundaries from the visibilitychange EVENT, so a long
      // hidden stretch is never miscounted as time the user spent watching.
      var _visAcc = 0, _visMark = Date.now(), _visWas = !document.hidden;
      function visMs() {
        var now = Date.now();
        if (_visWas) _visAcc += now - _visMark;
        _visMark = now; _visWas = !document.hidden;
        return _visAcc;
      }
      try { document.addEventListener("visibilitychange", visMs); } catch (e) {}
      // A sleep that ENDS EARLY when the user comes back, so returning re-polls at once
      // instead of waiting out a throttled background timer.
      function napOrReturn(ms, fn) {
        var done = false, t;
        function fin() {
          if (done) return;
          done = true;
          clearTimeout(t);
          try { document.removeEventListener("visibilitychange", onVis); } catch (e) {}
          fn();
        }
        function onVis() { if (!document.hidden) fin(); }
        try { document.addEventListener("visibilitychange", onVis); } catch (e) {}
        t = setTimeout(fin, ms);
      }
      function solRpcCall(method, params, attempt) {
        var url = RPCS[(attempt || 0) % RPCS.length];
        return fetchT(url, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: method, params: params })
        }, 12000).then(function (r) { return r.json(); });
      }
      var _solTracking = false;
      function trackToCompletion(sig, sp) {
        // One tracker at a time — the "Check again now" button re-enters this function, and
        // two live poll chains would race each other onto the card.
        if (_solTracking) return;
        _solTracking = true;
        var sameChain = !sp || String(sp.fromChain) === String(sp.toChain);
        var destName = sp ? chainName(sp.toChain) : "the destination chain";
        var toSym = (sp && sp.toSym) ? sp.toSym : "your tokens";
        function reshow(title, detail, cls, retry) {
          _solTracking = false;                 // this run is over — a retry may start another
          show(title, detail, cls);
          var d = document.createElement("div"); d.className = "addr";
          d.textContent = sig.slice(0, 12) + "…" + sig.slice(-12);
          cardEl.appendChild(d);
          // ⛔ A NON-TERMINAL ENDING IS NOT AN ENDING. evm.html grew a "Check again now"
          // button for exactly this; sol.html's three non-terminal cards were dead ends,
          // leaving a manual signature lookup as the only move.
          if (retry) addButton("Check again now", function () { trackToCompletion(sig, sp); }, true);
          // ⛔ AUTOMATIC ONLY ON A FINISHED SWAP. A card that is still confirming, still
          // bridging, or has FAILED must keep the tap-based return — leaving those screens
          // by ourselves would take the user away from information they still need.
          if (cls === "ok") { _solSwapDone = true; addTgAutoReturn(); } else addTgButton(true);
        }
        // ⚠️ SAY THAT TRACKING IS HAPPENING. Both loops below only ever called reshow() on a
        // TERMINAL state, so for the first two minutes of a bridge the card still read
        // "Swap submitted ✓" and nothing appeared to be watching it. Silence for ten
        // minutes is indistinguishable from a feature that does not exist — which is
        // exactly how it was reported.
        var announced = false;
        function announce() {
          if (announced) return;
          announced = true;
          reshow(sameChain ? "Confirming on Solana…" : ("Bridging to " + destName + "…"),

      }

      function fetchQuoteAndRender(sess, sp) {
        busy("Finding the best route…", "Fetching a live quote for your swap.");
        resolveQuote(sess, sp)
          .then(function (q) { renderQuote(sess, sp, q); })
          .catch(function (e) { showError((e && e.message) || e, function () { fetchQuoteAndRender(sess, sp); }); });
      }

      function fmtAmount(raw, decimals) {
        try { var n = Number(raw) / Math.pow(10, decimals || 0); return n.toLocaleString(undefined, { maximumFractionDigits: 6 }); }
        catch (e) { return raw; }
      }

      function renderQuote(sess, sp, lifi) {
        var est = lifi.estimate || {};
        var toDec = (lifi.action && lifi.action.toToken && lifi.action.toToken.decimals) || 0;
        var fromDec = (lifi.action && lifi.action.fromToken && lifi.action.fromToken.decimals) || 9;
        var recv = est.toAmount ? fmtAmount(est.toAmount, toDec) : "~";
        show("Confirm your swap", "");
        var q = document.createElement("div"); q.className = "quote";
        q.innerHTML =
          '<div class="quote-row"><span class="k">You send</span><span class="v">' + fmtAmount(sp.fromAmount, fromDec) + " " + sp.fromSym + '</span></div>' +
          '<div class="quote-row"><span class="k">You receive (est.)</span><span class="v quote-recv">~' + recv + " " + sp.toSym + '</span></div>' +
          '<div class="quote-row"><span class="k">Platform fee</span><span class="v">0.5%</span></div>';
        cardEl.appendChild(q);
        var note = document.createElement("div"); note.className = "note";
        note.textContent = "Excludes network & bridge fees. You'll approve the transaction in " + WNAME + ".";
        cardEl.appendChild(note);
        // Show WHICH wallet/account is connected (read-only) so the balance/"not enough SOL"
        // check isn't a mystery when a cached session sent the user straight here. NO reconnect
        // link — reconnecting hangs Phantom/Solflare (they already trust the app). Display only.
        var who = document.createElement("div"); who.className = "note";
        who.textContent = "Connected: ◎ " + sess.address.slice(0, 6) + "…" + sess.address.slice(-6);
        cardEl.appendChild(who);
        addButton("Swap now", function () { prepareSign(sess, sp); });
        addTgButton(true, "Cancel");
      }

      // Re-fetch a FRESH Li.Fi quote at the moment of swapping, so the transaction's
      // blockhash is brand-new when Phantom signs it (Solana blockhashes expire in
      // ~60-90s; the connect + approval round-trips otherwise outrun the initial
      // quote's blockhash). Then present a final "Approve" tap → wallet.
      function prepareSign(sess, sp) {
        busy("Locking in the latest price…", "Fetching a fresh quote so it doesn't expire.");
        var onErr = function (e) { showError((e && e.message) || e, function () { prepareSign(sess, sp); }); };
        // Primary Li.Fi (4s cap) → Jupiter fallback for same-chain Solana. `lifi` here may be
        // a real Li.Fi quote OR a Jupiter quote normalised to the same shape — rest is identical.
        resolveQuote(sess, sp)
          .then(function (lifi) {
            if (!lifi || !lifi.transactionRequest || !lifi.transactionRequest.data) throw new Error("Route unavailable right now — tap Retry.");
            var txB64 = lifi.transactionRequest.data;
            // Pre-simulate the transaction (no signature needed) BEFORE asking the user
            // to approve — catches bad routes/accounts and surfaces the exact program
            // logs, so we never send a doomed tx to the wallet.
            busy("Checking the swap…", "Simulating the transaction before you approve.");
            fetch(RPCS[0], {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "simulateTransaction", params: [txB64, { encoding: "base64", sigVerify: false, replaceRecentBlockhash: true, commitment: "processed" }] })
            })
              .then(function (r) { return r.json(); })
              .then(function (sim) {
                if (sim.error) throw new Error("Sim RPC error: " + (sim.error.message || JSON.stringify(sim.error)));
                var val = sim.result && sim.result.value;
                if (val && val.err) {
                  var logs = (val.logs || []).slice(-6).join("  •  ");
                  throw new Error("Simulation failed: " + JSON.stringify(val.err) + (logs ? "  —  LOGS: " + logs : ""));
                }
                // OK → build the sign deep link and show the Approve tap
                var enc = encryptPayload({ transaction: b58encode(b64ToBytes(txB64)), session: sess.session }, sess.shared);
                var redirect = THIS_PAGE + "?w=" + wallet + swapQS() + "&sign=1";
                var signUrl = walletUrl("signTransaction", {
                  dapp_encryption_public_key: sess.dappPub,
                  nonce: enc.nonce,
                  payload: enc.payload,
                  redirect_link: redirect,
                });
                var toDec = (lifi.action && lifi.action.toToken && lifi.action.toToken.decimals) || 0;
                var recv = (lifi.estimate && lifi.estimate.toAmount) ? fmtAmount(lifi.estimate.toAmount, toDec) : "~";
                // Stash human amounts + which aggregator built the tx, so the success handler
                // can log them to Supabase (it no longer has the quote object in scope).
                var _fromDec = (lifi.action && lifi.action.fromToken && lifi.action.fromToken.decimals) || 9;
                var famt = fmtAmount(sp.fromAmount, _fromDec);
                var agg = lifi._jup ? "Jupiter" : "Li.Fi";
                // The quote object is NOT in scope in the success handler, so the fee has to
                // be stashed here alongside the amounts — same reason recv/famt/agg are.
                var nvfee = nvFeeUsd(lifi), aggfee = aggFeeUsd(lifi);
                var setPending = function () { try { localStorage.setItem(PENDING_KEY, JSON.stringify({ sp: sp, ts: Date.now(), recv: recv, famt: famt, agg: agg, nvfee: nvfee, aggfee: aggfee })); } catch (e) {} };
                setPending();
                show("Approve in " + WNAME, "You'll receive ~" + recv + " " + sp.toSym + ". Approve promptly — the price is time-sensitive.");
                var link = addLink("Approve in " + WNAME, signUrl);
                link.onclick = setPending;
                addTgButton(true, "Cancel");
              })
              .catch(onErr);
          })
          .catch(onErr);
      }

      function signReturn() {
        busy("Submitting your swap…", "Broadcasting the signed transaction to Solana.");
        try {
          var sess = getSession();
          if (!sess || !sess.shared) throw new Error("Session expired — please reconnect.");
          var decrypted = decryptData(data, nonce, sess.shared);   // { transaction: signedTxB58 }
          if (!decrypted.transaction) throw new Error("Wallet did not return a signed transaction.");
          var b64 = bytesToB64(b58decode(decrypted.transaction));

          // Cycle through the RPCs WITH DELAYS. On mobile, returning from the wallet
          // app leaves the network briefly unready → the first fetch(es) throw
          // "Failed to fetch". Retrying after a short pause fixes it. Blockhash errors
          // are fatal (won't recover on retry) and stop immediately.
          var lastErr = "Broadcast failed";
          var attempt = 0, MAX = 8;
          function attemptBroadcast() {
            var rpc = RPCS[attempt % RPCS.length];
            fetch(rpc, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "sendTransaction", params: [b64, { encoding: "base64", skipPreflight: false, maxRetries: 5 }] })
            })
              .then(function (r) { return r.text().then(function (t) { return { status: r.status, text: t }; }); })
              .then(function (resp) {
                var res; try { res = JSON.parse(resp.text); } catch (e) { throw new Error("HTTP " + resp.status + " " + (resp.text || "").slice(0, 50)); }
                if (res.error) {
                  var em = (res.error && res.error.message) || "RPC error";
                  if (/blockhash|block height|expired|not found/i.test(em)) throw Object.assign(new Error(em), { fatal: true });
                  throw new Error(em);
                }
                onOk(res.result);
              })
              .catch(function (e) {
                lastErr = String((e && e.message) || e);
                if (e && e.fatal) { onFail(lastErr); return; }
                attempt++;
                if (attempt >= MAX) { onFail(lastErr); return; }
                busy("Submitting your swap…", "Network warming up — retrying (" + attempt + ")…");
                setTimeout(attemptBroadcast, 800);   // pause, then retry (next RPC)
              });
          }
          // Small initial delay so the network is ready after the wallet hand-back.
          setTimeout(attemptBroadcast, 1200);
          function onOk(sig) {
            // Log the successful swap to Supabase (wallet name + coarse geo). Best-effort;
            // read PENDING for the amounts/aggregator BEFORE we clear it below.
            try {
              var pend = JSON.parse(localStorage.getItem(PENDING_KEY) || "null");
              if (pend && pend.sp) {
                var psp = pend.sp;
                logSwap({
                  from_chain: chainName(psp.fromChain), to_chain: chainName(psp.toChain),
                  from_token: psp.fromSym, to_token: psp.toSym,
                  from_amount: pend.famt || "", to_amount: pend.recv || "",
                  from_wallet: sess.address, to_wallet: psp.toAddress || sess.address,
                  aggregator: pend.agg || "Li.Fi", tx_hash: sig, wallet_name: WNAME,
                  nexvault_fee_usd: pend.nvfee || "", aggregator_fee_usd: pend.aggfee || ""
                });
              }
            } catch (e) {}
            localStorage.removeItem(PENDING_KEY);
            try { history.replaceState(null, "", THIS_PAGE + "?w=" + wallet + "&done=1"); } catch (e) {}
            // ⚠️ "confirming on Solana" IS WRONG FOR A CROSS-CHAIN SWAP — the money has to
            // arrive on the DESTINATION chain. A SOL→AVAX swap sat on this sentence and the
            // owner reasonably read it as "the tracker never ran".
            var _psp2 = (pend && pend.sp) ? pend.sp : null;
            var _cross = _psp2 && String(_psp2.fromChain) !== String(_psp2.toChain);
            show("Swap submitted ✓",
                 _cross ? ("Confirming on Solana, then bridging to " + chainName(_psp2.toChain) + ". This usually takes a couple of minutes.")
                        : "Your transaction is confirming on Solana.", "ok");
            var d = document.createElement("div"); d.className = "addr"; d.textContent = sig.slice(0, 12) + "…" + sig.slice(-12); cardEl.appendChild(d);
            // No explorer link, per the same decision. The signature is still shown
            // above, so anyone who wants to look it up can copy it.
            addTgButton(true);
            // ⚠️ "SUBMITTED" IS NOT AN OUTCOME — follow it to the end, same rule as
            // evm.html's trackSwap(). This page used to STOP here: a SOL→TRX swap that
            // delivered perfectly still read "Your transaction is confirming on Solana",
            // forever, which tells the user nothing and makes them go and check a chain
            // explorer themselves. Worse, for a CROSS-CHAIN swap the sentence is simply
            // wrong — the money has to arrive on the DESTINATION chain, not Solana.
            trackToCompletion(sig, (pend && pend.sp) ? pend.sp : null);
          }
          function onFail(msg) {
            // Broadcast never succeeded — previously left no trace at all.
            try { var pf = JSON.parse(localStorage.getItem(PENDING_KEY) || "null"); logFail(msg, pf && pf.sp, ""); } catch (e) { logFail(msg, null, ""); }
            showError(msg, function () { location.href = retryHref(); });
          }
        } catch (e) {
          showError((e && e.message) || e, function () { location.href = retryHref(); });
        }
      }
    })();
    </script>
  </body>
</html>
