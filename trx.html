<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>NexVault · Tron Swap</title>
    <link rel="icon" type="image/png" href="/nexvault-app/icon.png" />
    <style>
      :root { --bg:#080810; --card:#14141f; --text:#e8e8f4; --muted:#9a9ab0; --purple:#8b7bfd; --line:rgba(255,255,255,.08); }
      * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
      html,body { margin:0; padding:0; background:var(--bg); color:var(--text); min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
      .wrap { max-width:460px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; }
      .logo { font-size:22px; font-weight:800; letter-spacing:.5px; margin-bottom:6px; }
      .logo span { background:linear-gradient(90deg,#8b7bfd,#3aa0ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
      .sub { color:var(--muted); font-size:13px; margin-bottom:26px; }
      .card { width:100%; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:24px 20px; }
      .spinner { width:38px; height:38px; margin:0 auto 16px; border:3px solid rgba(255,255,255,.15); border-top-color:var(--purple); border-radius:50%; animation:spin .8s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      .status { font-size:16px; font-weight:700; margin-bottom:8px; }
      .detail { color:var(--muted); font-size:12.5px; line-height:1.55; }
      .ok { color:#7ee0a1; } .err { color:#ff7a7a; }
      .quote { margin-top:16px; text-align:left; border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:rgba(0,0,0,.25); }
      .quote-row { display:flex; justify-content:space-between; font-size:13px; padding:4px 0; }
      .quote-row .k { color:var(--muted); } .quote-row .v { font-weight:600; }
      .quote-recv { color:#8b7bfd; font-weight:700; }
      .note { color:var(--muted); font-size:11px; margin-top:10px; line-height:1.5; }
      .warn { color:#ffcf7a; font-size:11.5px; margin-top:10px; line-height:1.55; text-align:left;
              background:rgba(255,207,122,.08); border:1px solid rgba(255,207,122,.22); border-radius:10px; padding:9px 11px; }
      .addr { color:var(--muted); font-size:11px; margin-top:12px; word-break:break-all; }
      .btn { display:block; width:100%; margin-top:16px; padding:15px; border:none; border-radius:14px; font-size:15px; font-weight:700; cursor:pointer; color:#fff; background:linear-gradient(90deg,#7b5bfd,#3aa0ff); text-align:center; text-decoration:none; }
      .btn.secondary { background:rgba(255,255,255,.06); border:1px solid var(--line); color:var(--text); }
      .btn[disabled] { opacity:.5; pointer-events:none; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">Nex<span>Vault</span></div>
      <div class="sub" id="sub">Tron Swap</div>
      <div class="card" id="card">
        <div class="spinner" id="spinner"></div>
        <div class="status" id="status">Starting…</div>
        <div class="detail" id="detail"></div>
      </div>
    </div>

    <script type="module">
      /* ╔═══════════════════════════════════════════════════════════════════════════╗
         ║ NexVault TRON SWAP ENGINE — Tron as the SOURCE chain.                     ║
         ║                                                                           ║
         ║ ⛔ WHY THIS IS THE evm.html MODEL AND NOT THE sol.html MODEL.             ║
         ║ sol.html works because Phantom publishes an ENCRYPTED DEEP-LINK PROTOCOL: ║
         ║ a plain web page hands over a transaction and the SIGNATURE comes back in ║
         ║ the redirect. TronLink has no such thing. Its deeplink docs do define a   ║
         ║ `sign` action, but (a) the result is delivered to an HTTPS callback on a  ║
         ║ SERVER, with no mechanism to return anything to the originating tab, and  ║
         ║ (b) it never returns a signature at all — TronLink signs AND broadcasts   ║
         ║ itself and hands back only a tx hash. So the sol.html shape is not merely ║
         ║ harder here, it is impossible. (docs.tronlink.org/mobile/deeplink,        ║
         ║ verified 2026-08-14.)                                                     ║
         ║                                                                           ║
         ║ Therefore: this page runs INSIDE TronLink's own dApp browser, where       ║
         ║ TronWeb is injected, exactly as evm.html runs inside a wallet's browser.  ║
         ║ SwapPage opens it through evmbrowse.html, which fires                     ║
         ║ tronlinkoutside://pull.activity — Telegram's openLink cannot fire a       ║
         ║ custom scheme, and TronLink publishes no https universal link.            ║
         ╚═══════════════════════════════════════════════════════════════════════════╝ */

      // ⚠️ HAND-MAINTAINED, like evm.html's. The deploy script does not stamp it.
      var BUILD = "trx-2026-08-15h";

      var BASE = "https://nexvaultapp.com";
      var IS_ANDROID = /android/i.test(navigator.userAgent);
      var TG_WEB = "https://t.me/TheNexVaultBot";   // no launch param: cannot spawn a 2nd instance
      // Identical to evm.html/sol.html. See the evidence banner on addTgButton() below.
      var TG = IS_ANDROID
        ? "intent://resolve?domain=TheNexVaultBot#Intent;scheme=tg;S.browser_fallback_url="
          + encodeURIComponent(TG_WEB) + ";end"
        : "tg://resolve?domain=TheNexVaultBot";

      var LIFI = "https://li.quest/v1/quote";
      var INTEGRATOR = "nexvault-1";
      var TRON_CHAIN_ID = 728126428;
      var TRX_NATIVE = "T9yD14Nj9j7xAB4dbGeiX9h8unkKHxuWwb";   // Li.Fi's address for native TRX
      // ⚠️ NOT the EVM zero address. Quoting TRX with 0x000…0 returns "could not find token
      // on chain", which reads like an unsupported chain and is not one — that misread once
      // produced a wrong "Tron is unsupported" conclusion and cost two rounds of probing.

      // Our OWN TronWeb, from a CDN, used for everything except the signature. The injected
      // TronLink build may predate deserializeTx / getCurrentRefBlockParams / newTxID, so
      // relying on it for the rebuild would break on older wallets with no clear error.
      // Li.Fi's own SDK does exactly this: bundled TronWeb for RPC and rebuild, the wallet
      // object touched ONLY for trx.sign.
      // 🔴 THE FIRST TWO SOURCES HERE WERE BOTH **ON-THE-FLY ESM BUILD SERVICES**, AND
      // TRONWEB IS THE WORST POSSIBLE INPUT FOR ONE (2026-08-14). `esm.sh/tronweb` and
      // jsDelivr's `/+esm` do not serve a file — they COMPILE the package on request, and
      // tronweb is ~1MB across 9 dependencies (ethers, google-protobuf, axios,
      // ethereum-cryptography…). The page reached the owner as "Couldn't load the Tron
      // library" on the very first build that was ever actually served.
      // ⛔ **TRONWEB SHIPS A PREBUILT BROWSER BUNDLE AND WE WERE NOT USING IT.**
      // `dist/TronWeb.js` is a 963KB UMD webpack build, present in the npm tarball, served
      // as a STATIC FILE by every CDN — nothing to compile, nothing to fail. That is now
      // tier 1, from TWO independent hosts. The ESM services stay as tiers 3-4 only.
      // ⚠️ jsDelivr is first because `evm.html` already proves that host reaches this
      // owner's device — it is where the WalletConnect provider comes from on the EVM path
      // that has completed real swaps. Prefer a host with evidence over a host with a
      // reputation.
      // ⚠️ THE UMD GLOBAL IS A NAMESPACE, NOT THE CLASS. `window.TronWeb` is
      // `{utils, BigNumber, TransactionBuilder, Trx, …, TronWeb}` — the CONSTRUCTOR is
      // `window.TronWeb.TronWeb`. Using the global directly gives "not a constructor".
      var TRONWEB_SOURCES = [
        { kind: "umd", url: "https://cdn.jsdelivr.net/npm/tronweb@6.4.0/dist/TronWeb.js" },
        { kind: "umd", url: "https://unpkg.com/tronweb@6.4.0/dist/TronWeb.js" },
        { kind: "esm", url: "https://esm.sh/tronweb@6.4.0" },
        { kind: "esm", url: "https://cdn.jsdelivr.net/npm/tronweb@6.4.0/+esm" },
      ];
      var TRON_RPCS = [
        "https://api.trongrid.io",
        "https://tron-rpc.publicnode.com",
      ];
      // ── 🔑 TRONGRID API KEY ────────────────────────────────────────────────────
      // Without one, TronGrid allows ONE REQUEST PER SECOND per IP (10 → 8 → 6 → 3 → 1 QPS
      // across May–June 2023, never raised). The cost model fires four reads back to back,
      // so the last of them was refused every time and the page could never price energy.
      // ⚠️ THIS KEY IS PUBLIC AND THAT IS BY DESIGN. trx.html is served from GitHub Pages;
      // anything in it is readable. The defence is NOT secrecy — it is TronGrid's per-key
      // **Origin allowlist**, set to https://nexvaultapp.com (and https://ruleworldc.github.io
      // while the old origin still serves), which makes the key useless from any other site.
      // ⛔ ADD EVERY NEW ORIGIN TO THE ALLOWLIST BEFORE DEPLOYING TO IT — a missing entry is a
      // 403 on the cost reads and the page silently falls back to bandwidth-only pricing.
      // Do not treat this like a server secret and do not put
      // it in .dev.vars; it is a public identifier with a domain lock on it.
      // ⛔ IF THE ORIGIN ALLOWLIST IS NOT SET, THIS KEY IS OPEN TO ANYONE WHO READS THE PAGE.
      // ✅ Verified against tronweb 6.4.0 src/tronweb.ts:132 → setFullNodeHeader(headers),
      // which builds a fresh HttpProvider carrying them on every request.
      var TRONGRID_KEY = "ab2fbe68-42b2-4d24-8017-221c18815dbb";
      // ⚠️ ONLY api.trongrid.io TAKES THIS HEADER. The publicnode fallback does not want it
      // and sending an unknown header to a different host is a way to get a CORS preflight
      // refused — which would turn a working fallback into a dead one.
      function tronHeaders(host) {
        return (TRONGRID_KEY && /trongrid\.io/.test(String(host || "")))
          ? { "TRON-PRO-API-KEY": TRONGRID_KEY }
          : null;
      }

      var params = new URLSearchParams(location.search);
      var P = {
        from:  params.get("from") || String(TRON_CHAIN_ID),
        to:    params.get("to")   || "",
        ftok:  params.get("ftok") || "",
        ttok:  params.get("ttok") || "",
        fdec:  params.get("fdec"),
        amt:   params.get("amt")  || "",     // HUMAN amount — see the banner on toBaseUnits()
        rcpt:  params.get("rcpt") || "",
        slip:  params.get("slip") || "0.03",
        fsym:  params.get("fsym") || "",
        tsym:  params.get("tsym") || "",
        // ── ⛔ WHAT THE USER ASKED FOR vs WHAT THIS LEG DOES ──────────────────────
        // Owner requirement 2026-08-14: "the header should still say TRX to XPL … why
        // should we display trx to pol to the user in the first place?" — correct. The
        // headline is the user's INTENT, always.
        // ⚠️ BUT THE AMOUNTS ARE NOT NEGOTIABLE. This leg really does deliver POL, so
        // "You get" and the success card must say POL or the page would promise a token
        // that is not arriving. Intent goes in the TITLE, the truth stays on the numbers,
        // and one subline reconciles them: "Step 1 of 2 · via Polygon".
        gsym:  params.get("gsym") || "",     // the final token the user actually wants
        step:  params.get("step") || "",     // "1" when this is leg 1 of a two-hop
        fee:   params.get("fee")  || "0.005",
        tier:  params.get("tier") || "",
        name:  params.get("name") || "TronLink",
      };
      P.fromName = "Tron";

      var elStatus = document.getElementById("status");
      var elDetail = document.getElementById("detail");
      var elCard   = document.getElementById("card");
      var elSpin   = document.getElementById("spinner");
      var elSub    = document.getElementById("sub");

      var _dbg = document.createElement("div");
      _dbg.style.cssText = "position:fixed;left:0;right:0;bottom:0;background:rgba(0,0,0,.88);color:#7ee0a1;font:10px/1.4 ui-monospace,monospace;padding:4px 7px;white-space:pre-wrap;word-break:break-all;z-index:99999;";
      function setDbg(s) { try { _dbg.textContent = BUILD + " | " + s; } catch (e) {} }
      try { document.body.appendChild(_dbg); setDbg("loading…"); } catch (e) {}

      function show(title, detail, cls, spin) {
        elSpin.style.display = spin ? "block" : "none";
        elStatus.textContent = title;
        elStatus.className = "status" + (cls ? " " + cls : "");
        elDetail.innerHTML = detail || "";
        while (elCard.children.length > 3) elCard.removeChild(elCard.lastChild);
      }
      function addButton(label, onClick, secondary) {
        var b = document.createElement("button");
        b.className = "btn" + (secondary ? " secondary" : "");
        b.textContent = label; b.onclick = onClick;
        elCard.appendChild(b); return b;
      }
      function addLink(label, href) {
        var a = document.createElement("a");
        a.textContent = label; a.href = href; a.target = "_blank"; a.rel = "noopener";
        a.style.cssText = "display:block;margin-top:12px;color:#8b7bfd;font-size:12px;";
        elCard.appendChild(a); return a;
      }
      function addWarn(html) {
        var d = document.createElement("div");
        d.className = "warn"; d.innerHTML = html;
        elCard.appendChild(d); return d;
      }
      // ── RETURNING TO TELEGRAM ─────────────────────────────────────────────────
      // Identical to evm.html and sol.html, and for the same evidenced reasons: t.me IS a
      // verified Android App Link but the routing is OFF on the affected device; Chromium
      // forbids launching an app from a browser_fallback_url on the same user activation, so
      // routing through the t.me page is a guaranteed dead end; and Samsung Internet gates
      // intent:// behind a consent dialog even on a genuine tap.
      // ⛔ THE RELIABLE PATH MUST NOT SIT BEHIND THE ONE THAT MAY FAIL — the recent-apps
      // instruction is rendered ABOVE the button. ⛔ NO ?startapp (spawns a 2nd Mini App).
      // ⛔ NO automatic or timed navigation. ⛔ NO t.me link in the UI.
      function addTgButton(secondary, label) {
        var lead = document.createElement("div");
        lead.className = "note";
        lead.style.cssText = "margin-top:16px;color:var(--text);font-size:12.5px;line-height:1.6;background:rgba(139,123,253,.10);border:1px solid var(--line);border-radius:12px;padding:11px 13px;text-align:left;";
        lead.innerHTML = "<b>Your swap is safe — nothing else to do here.</b><br>"
                       + "To get back to NexVault, open your phone's recent-apps view and tap "
                       + "<b>Telegram</b>. It is still open where you left it.";
        elCard.appendChild(lead);

        var a = document.createElement("a");
        a.className = "btn" + ((secondary || IS_ANDROID) ? " secondary" : "");
        a.textContent = label || (IS_ANDROID ? "Try reopening Telegram" : "Back to Telegram");
        a.href = TG;
        a.rel = "noopener";
        elCard.appendChild(a);

        // 🔴 THE TAP CAN DO NOTHING AT ALL, AND THE PAGE SAID NOTHING (2026-08-15).
        // Owner tapped "Try reopening Telegram" in Samsung Internet: no app switch, no
        // dialog, no navigation. Silence.
        // ✅ VERIFIED IN CHROMIUM SOURCE (ExternalNavigationHandler.java, main): Chrome can
        // NEVER silently no-op a tapped intent:// — it launches the app, shows a "Continue
        // to…" banner, or navigates the tab to S.browser_fallback_url. A true no-op therefore
        // means the BROWSER dropped it, which matches Samsung Internet's intent handling
        // (SamsungInternet/support#16 and #71, both still open, no vendor documentation).
        // ⛔ WE CANNOT FIX SAMSUNG'S BROWSER. We CAN stop pretending the tap worked.
        // ⚠️ TEXT ONLY — NO AUTOMATIC OR TIMED NAVIGATION, ever. The timer changes words.
        // ⚠️ AND THE ELAPSED-TIME GUARD IS NOT DECORATION: a backgrounded page's timers are
        // throttled or frozen, so a 2s timeout can fire LATE — after the user has come back
        // from Telegram — and would call a success a failure. The "never went hidden" flag
        // AND the wall clock must both hold. (HTML Living Standard, Page Visibility.)
        // ⚠️ package= IS DELIBERATELY ABSENT from TG. t.me/.well-known/assetlinks.json lists
        // FOUR packages (org.telegram.messenger, .web, .beta, org.thunderdog.challegram) and
        // an intent URI accepts only one — naming it would exclude the other three.
        if (IS_ANDROID) {
          var _left = false;
          var _mark = function () { _left = true; };
          a.addEventListener("click", function () {
            var t0 = Date.now();
            document.addEventListener("visibilitychange", _mark);
            window.addEventListener("pagehide", _mark);
            setTimeout(function () {
              try {
                document.removeEventListener("visibilitychange", _mark);
                window.removeEventListener("pagehide", _mark);
                if (_left || document.hidden || (Date.now() - t0) > 3500) return;
                if (document.getElementById("nvtgfail")) return;
                var f = document.createElement("div");
                f.id = "nvtgfail";
                f.className = "note";
                f.style.cssText = "margin-top:10px;text-align:left;line-height:1.6;";
                f.innerHTML = "<b>That didn't open Telegram — your browser blocked it.</b> "
                            + "Your swap is unaffected. Open Telegram from recent apps or your "
                            + "home screen, or try the direct link below. To stop this happening, "
                            + "turn on <i>Open links in other apps</i> in Samsung Internet "
                            + "(Settings \u2192 Useful features).";
                // A SECOND, DIFFERENT MECHANISM — not a retry of the one that just failed.
                // Telegram registers scheme "tg" with BROWSABLE in its own manifest, and a
                // bare tg:// takes a different path through the browser than intent://.
                var d = document.createElement("a");
                d.className = "btn secondary";
                d.textContent = "Open Telegram directly";
                d.href = "tg://resolve?domain=TheNexVaultBot";
                d.rel = "noopener";
                a.parentNode.insertBefore(f, a.nextSibling);
                f.parentNode.insertBefore(d, f.nextSibling);
              } catch (e) {}
            }, 2000);
          });
        }

        var hint = document.createElement("div");
        hint.className = "note";
        hint.innerHTML = "If your browser asks — <b>“…blocked from automatically opening "
                       + "an external application”</b> — tap <b>ALLOW</b>. To stop it asking, "
                       + "turn on <i>Open supported links</i> for Telegram in Android app settings "
                       + "(or <i>Open links in other apps</i> in your browser settings). If it "
                       + "still won't open, use recent apps as above — the swap is unaffected.";
        elCard.appendChild(hint);
        return a;
      }

      // ── EXPLORER ──────────────────────────────────────────────────────────────
      // ⛔ A TRON TXID HAS NO 0x PREFIX. Every hash guard copied from evm.html is
      // /^0x[0-9a-f]{64}$/ and would silently drop every link on this page — the tx would
      // look untracked when it was fine. 64 bare hex characters, and nothing else.
      function isTronTxId(h) { return typeof h === "string" && /^[0-9a-f]{64}$/i.test(h); }
      var EXPLORER = {
        728126428:        "https://tronscan.org/transaction/",
        1:                "https://etherscan.io/tx/",
        10:               "https://optimistic.etherscan.io/tx/",
        56:               "https://bscscan.com/tx/",
        137:              "https://polygonscan.com/tx/",
        8453:             "https://basescan.org/tx/",
        42161:            "https://arbiscan.io/tx/",
        43114:            "https://snowtrace.io/tx/",
        5000:             "https://mantlescan.xyz/tx/",
        143:              "https://monadscan.com/tx/",
        59144:            "https://lineascan.build/tx/",
        534352:           "https://scrollscan.com/tx/",
        324:              "https://explorer.zksync.io/tx/",
        1329:             "https://seitrace.com/tx/",
        146:              "https://sonicscan.org/tx/",
        9745:             "https://plasmascan.to/tx/",
        1151111081099710: "https://solscan.io/tx/",
        20000000000001:   "https://mempool.space/tx/"
      };
      var EXPLORER_SUFFIX = { 1329: "?chain=pacific-1" };
      function explorerTx(id, hash) {
        var p = EXPLORER[id];
        if (!p) return "https://blockscan.com/tx/" + hash;
        return p + hash + (EXPLORER_SUFFIX[id] || "");
      }
      function chainName(id) {
        var m = { 1:"Ethereum", 10:"Optimism", 56:"BNB Chain", 137:"Polygon", 8453:"Base",
                  42161:"Arbitrum", 43114:"Avalanche", 5000:"Mantle", 143:"Monad",
                  59144:"Linea", 534352:"Scroll", 324:"zkSync Era", 1329:"Sei", 146:"Sonic",
                  9745:"Plasma", 728126428:"Tron",
                  1151111081099710:"Solana", 20000000000001:"Bitcoin" };
        return m[id] || ("chain " + id);
      }
      P.toName = chainName(Number(P.to));

      // ── TIMEOUTS / VISIBLE TIME / NAP ─────────────────────────────────────────
      // Lifted verbatim from evm.html after the 2026-08-09 wedge, and for the same reason:
      // a fetch in flight when a mobile WebView freezes can settle NEVER, and an awaited
      // loop then stops dead with nothing thrown for try/catch to catch.
      function fetchT(url, opts, ms) {
        ms = ms || 15000;
        var ctl = (typeof AbortController === "function") ? new AbortController() : null;
        var timer;
        var o = {};
        for (var k in (opts || {})) o[k] = opts[k];
        if (ctl) o.signal = ctl.signal;
        var bell = new Promise(function (_res, rej) {
          timer = setTimeout(function () {
            try { if (ctl) ctl.abort(); } catch (e) {}
            rej(new Error("status-timeout"));
          }, ms);
        });
        return Promise.race([fetch(url, o), bell])
          .then(function (r) { clearTimeout(timer); return r; },
                function (e) { clearTimeout(timer); throw e; });
      }
      var _visAcc = 0, _visMark = Date.now(), _visWas = !document.hidden;
      function visMs() {
        var now = Date.now();
        if (_visWas) _visAcc += now - _visMark;
        _visMark = now; _visWas = !document.hidden;
        return _visAcc;
      }
      try { document.addEventListener("visibilitychange", visMs); } catch (e) {}
      function napOrReturn(ms) {
        return new Promise(function (res) {
          var done = false, t;
          function fin() {
            if (done) return;
            done = true;
            clearTimeout(t);
            try { document.removeEventListener("visibilitychange", onVis); } catch (e) {}
            res();
          }
          function onVis() { if (!document.hidden) fin(); }
          try { document.addEventListener("visibilitychange", onVis); } catch (e) {}
          t = setTimeout(fin, ms);
        });
      }

      // ── SUPABASE SWAP LOG ─────────────────────────────────────────────────────
      // ⛔ tab STAYS "EVM" — THREE VALUES, NOT FOUR. Tron is its own ecosystem technically,
      // but `tab` is a REPORTING field, and normalize_swap_logs.sql plus every admin filter
      // are built on TON | EVM | SOL. A fourth value would silently drop Tron rows out of
      // views that enumerate the three — the row exists, nobody sees it, which is the same
      // class of blind spot as the missing rows this logging was added to fix.
      // Owner decision 2026-08-14: Tron reports under EVM. `from_chain` already says "Tron",
      // so nothing is lost — the family label is coarser than the chain, by design.
      // Logged at BROADCAST, not at delivery: anon RLS is INSERT-ONLY so a row cannot be
      // updated later, and a row written only on completion is lost whenever the user
      // closes the page during the bridge wait.
      var SUPABASE_URL = "https://dxtnqmhuxyftrbkbkgxr.supabase.co";
      var SUPABASE_ANON_KEY = "sb_publishable_bhDEkqUa7Oh6CNx2pnf1_A_D6z4Hj59";
      var _geo = {};
      try {
        fetch("https://ipapi.co/json/").then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) { if (d && !d.error) _geo = { country: d.country_name || d.country, region: d.region }; })
          .catch(function () {});
      } catch (e) {}
      var _logged = false, _loggedFail = false;
      function logFail(reason, txHash) {
        if (_loggedFail) return;

        try {
          var txReq = q.transactionRequest;
          setDbg("re-checking your balance…");
          await preflightBlock(q);

          var amountBase = toBaseUnits(P.amt, q._fromDec);
          await approveIfNeeded(q, amountBase);

          show("Confirm the swap", "Approve the transaction in TronLink.", "", true);
          // ⛔ REBUILD IMMEDIATELY BEFORE SIGNING. A Tron transaction carries an expiration
          // (~60s) and TAPOS fields tied to a recent block; the user may have spent a minute
          // on the approval prompt. Building here, not at quote time, is what keeps it valid.
          setDbg("building the transaction…");
          var signable = await buildSignable(txReq);
          recSet({ phase: "in_flight", tool: (q.tool || ""), tdec: (q.action && q.action.toToken && q.action.toToken.decimals) });
          var signed = await signWithWallet(signable);
          setDbg("sending it to the Tron network…");
          var txHash = await broadcast(signed);
          recSet({ phase: "submitted", txHash: txHash });
          recordHopTx(txHash);
          recSet({
            to_wallet: (function () { try { return destAddress(); } catch (e) { return ""; } })(),
            // 🔴 LI.FI'S toAmount IS IN BASE UNITS, AND IT WAS LOGGED RAW (2026-08-15).
            // The owner's TRX → POL row read "62059508725513502720.0000 POL". That is
            // 62.0595 POL — the quote was right, the decimals were never applied, and the
            // number that reached the dashboard was meaningless.
            // ⚠️ evm.html HAS ALWAYS CONVERTED (its rows read 4.3447 and 6.0353). trx.html
            // was the odd one out, so only Tron rows are wrong.
            // ⛔ NO DECIMALS ⇒ NO NUMBER. Guessing 18 would write a plausible wrong figure,
            // which is worse than a blank: a blank is visibly missing.
            to_amount: (function () {
              try {
                var raw = q.estimate && q.estimate.toAmount;
                var d   = q.action && q.action.toToken && q.action.toToken.decimals;
                if (raw == null || raw === "" || d == null) return "";
                return String(Number(raw) / Math.pow(10, d));
              } catch (e) { return ""; }
            })(),
            aggregator: (q.tool || "Li.Fi"),
            nexvault_fee_usd: nvFeeUsd(q), aggregator_fee_usd: aggFeeUsd(q)
          });
          logRetryFromRecord();
          await trackSwap(txHash, recGet() && recGet().tool, recGet() && recGet().tdec);
        } catch (e) {
          logFail((e && e.message) || e, (recGet() && recGet().txHash) || "");
          // ⛔ NEVER OFFER TO RE-SEND A SWAP THAT IS ALREADY BROADCAST. Everything after
          // broadcast() resolves lands in this same catch.
          var _r = recGet();
          if (_r && (_r.phase === "submitted" || _r.phase === "done" || _r.phase === "failed")) {
            var again = function () {
              trackSwap(_r.txHash, _r.tool, _r.tdec, true).catch(function (e2) { showError((e2 && e2.message) || e2, again); });
            };
            showError((e && e.message) || e, again);
          } else {
            showError((e && e.message) || e, function () { start(); });
          }
        }
      }

      // ── TRACKING ──────────────────────────────────────────────────────────────
      // Same shape as evm.html after the 2026-08-09 wedge: every poll has its own timeout,
      // the budget is VISIBLE time with a per-run baseline, returning to the page re-polls
      // at once, and HTTP 404 counts as "not indexed yet".
      // ⛔ THE TXID GOES IN BARE. Li.Fi's own SDK strips any 0x before calling /status, and
      // a Tron txid never has one to begin with.
      function renderDone(got, recvTx, txHash) {
        // ⚠️ NAMES THE REAL TOKEN — POL, not the goal. Claiming XPL here would be a lie
        // about what is in the wallet, and the whole point of the second step would be
        // invisible. The next line tells them what remains.
        show("Received " + (got ? got + " " + P.tsym : P.tsym) + " ✅",
             (got ? (got + " " + P.tsym + " has arrived in your wallet on " + P.toName + ".")
                  : ("Your " + P.tsym + " has arrived on " + P.toName + "."))
             + (P.step === "1"
                 ? " That was step 1 of 2 — go back to NexVault and tap Finish step 2 to swap it to "
                   + P.gsym + "."
                 : ""),
             "ok", false);
        if (isTronTxId(txHash)) addLink("View transaction", explorerTx(TRON_CHAIN_ID, txHash));
        if (recvTx) addLink("View on destination chain", explorerTx(Number(P.to), recvTx));
        addTgButton(false, "Back to NexVault");
      }
      function renderFailed(txHash) {
        show("Swap failed", "The bridge reported a failure. Your funds are usually returned automatically — check the transaction for details.", "err", false);
        if (isTronTxId(txHash)) addLink("View transaction", explorerTx(TRON_CHAIN_ID, txHash));
        addTgButton(false, "Back to NexVault");
      }
      function addCheckAgain(txHash, tool, tdec) {
        addButton("Check again now", function () {
          trackSwap(txHash, tool, tdec, true).catch(function (e) { showError((e && e.message) || e, null); });
        }, true);
      }
      var _tracking = false;
      async function trackSwap(txHash, tool, tdec, resuming) {
        if (_tracking) return;
        _tracking = true;
        try { await trackSwapInner(txHash, tool, tdec, resuming); }
        finally { _tracking = false; }
      }
      async function trackSwapInner(txHash, tool, tdec, resuming) {
        try { console.log("[NexVault TRX] swap tx", txHash); } catch (e) {}
        var head = resuming ? "Checking your swap…" : "Swap submitted";
        function pollLine(s) {
          try { var el = document.getElementById("nvpoll"); if (el) el.textContent = s; } catch (e) {}
        }
        show(head,
             (P.step === "1" ? "Step 1 of 2 — confirming on Tron, then bridging to " + P.tsym
                             : "Confirming on Tron, then bridging to " + P.tsym)
           + ". This usually takes a few minutes — you can leave this page open.<br>"
           + "<span id=\"nvpoll\" style=\"opacity:.72\"></span>", "", true);
        pollLine("Asking the bridge tracker…");
        if (isTronTxId(txHash)) addLink("View transaction", explorerTx(TRON_CHAIN_ID, txHash));

        var _final = null, _lastStatus = "", _polls = 0;
        var _bridge = tool || "";
        var _nfSince = -1;
        var VIS_BASE   = visMs();
        var VIS_BUDGET = 10 * 60 * 1000;
        var HARD_CAP   = Date.now() + 6 * 60 * 60 * 1000;
        var NF_GIVE_UP = 6 * 60 * 1000;
        var wait = 4000;

        while ((visMs() - VIS_BASE) < VIS_BUDGET && Date.now() < HARD_CAP) {
          _polls++;
          var note = "";
          try {
            var su = "https://li.quest/v1/status?txHash=" + encodeURIComponent(txHash)
                   + "&fromChain=" + encodeURIComponent(TRON_CHAIN_ID) + "&toChain=" + encodeURIComponent(P.to)
                   + (_bridge ? "&bridge=" + encodeURIComponent(_bridge) : "");
            var sr = await fetchT(su, null, 15000);
            if (!sr.ok) {
              note = "HTTP " + sr.status;
              if (sr.status === 400 && _bridge) { _bridge = ""; note += " · dropping the bridge hint"; wait = 800; }
              else if (sr.status === 404) { _lastStatus = "NOT_FOUND"; if (_nfSince < 0) _nfSince = visMs(); wait = 4000; }
              else if (sr.status === 429) { wait = Math.min(wait * 2, 30000); }
              else { wait = 4000; }
            } else {
              wait = 4000;
              var sj = await sr.json();
              _lastStatus = (sj && sj.status) || "";
              if (_lastStatus === "NOT_FOUND" || _lastStatus === "INVALID") { if (_nfSince < 0) _nfSince = visMs(); }
              else _nfSince = -1;
              if (sj && (_lastStatus === "DONE" || _lastStatus === "FAILED")) { _final = sj; break; }
            }
          } catch (e) {
            note = ((e && e.message) === "status-timeout") ? "timed out · retrying" : "network hiccup · retrying";
          }
          var line = "Checked " + _polls + (_polls === 1 ? " time · " : " times · ")
                   + (note || ("bridge says " + (_lastStatus || "pending").toLowerCase()));
          pollLine(line);
          try { setDbg("status " + (_lastStatus || "-") + " · " + _polls + (note ? " · " + note : "")); } catch (e) {}
          if (_nfSince >= 0 && (visMs() - _nfSince) >= NF_GIVE_UP) break;
          await napOrReturn(wait);
        }

        if (_final && _final.status === "DONE") {
          var got = null;
          try {
            var rc2 = _final.receiving;
            var _d = (rc2 && rc2.token && rc2.token.decimals);
            if (_d == null) _d = tdec;
            if (rc2 && rc2.amount && _d != null) got = (Number(rc2.amount) / Math.pow(10, _d)).toFixed(6);
          } catch (e) {}
          var recvTx = (_final.receiving && _final.receiving.txHash) || "";
          recSet({ phase: "done", got: got || "", recvTx: recvTx });
          renderDone(got, recvTx, txHash);
        } else if (_final && _final.status === "FAILED") {
          recSet({ phase: "failed" });
          logFail("bridge reported FAILED", txHash);
          renderFailed(txHash);
        } else if (_nfSince >= 0) {
          show("Submitted — can't track it here",
               "Your transaction was sent, but the bridge tracker hasn't picked it up. This does NOT mean it failed. Open the transaction below to see its real state; do not send it again.",
               "", false);
          if (isTronTxId(txHash)) addLink("View transaction", explorerTx(TRON_CHAIN_ID, txHash));
          addCheckAgain(txHash, tool, tdec);
          addTgButton(false, "Back to NexVault");
        } else {
          show("Still bridging", "Your swap is confirmed on Tron and still in transit. This can take longer at busy times — it will arrive without any further action from you. Use the link above to track it.", "", false);
          if (isTronTxId(txHash)) addLink("View transaction", explorerTx(TRON_CHAIN_ID, txHash));
          addCheckAgain(txHash, tool, tdec);
          addTgButton(false, "Back to NexVault");
        }
      }

      // ── RESUME ────────────────────────────────────────────────────────────────
      // ⛔ A RECORDED OUTCOME IS DRAWN FROM THE RECORD, NEVER RE-FETCHED.
      function addNewSwapEscape() {
        var armed = false;
        var b = addButton("Start this swap again", function () {
          if (!armed) {
            armed = true;
            b.textContent = "Tap again — only if the first one did NOT go through";
            b.className = "btn";
            setTimeout(function () { if (armed) { armed = false; b.textContent = "Start this swap again"; b.className = "btn secondary"; } }, 6000);
            return;
          }
          recClear(); start();
        }, true);
      }
      function resumeIfAlreadySwapped() {
        var r = recGet();
        if (!r || !r.phase) return false;
        if (r.phase === "done")   { renderDone(r.got || null, r.recvTx || "", r.txHash); addNewSwapEscape(); return true; }
        if (r.phase === "failed") { renderFailed(r.txHash); addNewSwapEscape(); return true; }
        if (r.phase === "submitted") {
          var retrack = function () {
            trackSwap(r.txHash, r.tool, r.tdec, true).catch(function (e) { showError((e && e.message) || e, retrack); });
          };
          retrack();
          addNewSwapEscape();
          return true;
        }
        if (r.phase === "in_flight") {
          show("This swap was already started",
               "A transaction for this swap was sent to TronLink and we didn't get its id back — it may already be on chain. <b>Check your wallet or Tronscan before trying again.</b> Sending it twice would swap twice.",
               "err", false);
          addTgButton(false, "Back to NexVault");
          addNewSwapEscape();
          return true;
        }
        return false;
      }

      // ── ENTRY ─────────────────────────────────────────────────────────────────
      async function start() {
        try {
          show("Loading", "Preparing the Tron connection.", "", true);
          if (!TronWebCtor) TronWebCtor = await loadTronWeb();
          if (!tw) {
            var _host = TRON_RPCS[0], _hdrs = tronHeaders(_host);
            tw = _hdrs
              ? new TronWebCtor({ fullHost: _host, headers: _hdrs })
              : new TronWebCtor({ fullHost: _host });
          }
          await connect();
          // ⛔ THE HEADLINE IS THE USER'S SWAP, NOT THIS LEG. On a two-hop the goal token
          // is carried in `gsym`; the leg is stated underneath so the POL figures below
          // still make sense.
          elSub.textContent = P.fsym + " → " + (P.gsym || P.tsym)
            + (P.step === "1" ? "   ·   Step 1 of 2 · via " + P.toName : "");
          show("Getting the best route", "Asking Li.Fi for a quote on this swap.", "", true);
          var q = await getLifi();
          await renderQuote(q);
        } catch (e) {
          showError((e && e.message) || e, function () { start(); });
        }
      }

      if (!P.to || !P.ftok || !P.ttok || !P.amt) {
        show("Nothing to swap", "This page was opened without swap details. Return to NexVault and start again.", "err", false);
        addTgButton(false, "Back to NexVault");
      } else {
        try { logRetryFromRecord(); } catch (e) {}
        if (!resumeIfAlreadySwapped()) start();
      }
    </script>
  </body>
</html>
